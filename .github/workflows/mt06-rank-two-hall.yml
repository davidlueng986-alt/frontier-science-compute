name: MT-06 rank-two Hall verification

on:
  push:
    paths:
      - 'jobs/mt06-rank-two-hall/**'
      - '.github/workflows/mt06-rank-two-hall.yml'
  pull_request:
    paths:
      - 'jobs/mt06-rank-two-hall/**'
      - '.github/workflows/mt06-rank-two-hall.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: jobs/mt06-rank-two-hall
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: jobs/mt06-rank-two-hall/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify identities and independent transmission calculations
        run: python run_verification.py
      - name: Reproduce attaining-family figures
        run: python make_figures.py
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt06-rank-two-hall-${{ github.sha }}
          path: |
            jobs/mt06-rank-two-hall/results/
            jobs/mt06-rank-two-hall/figures/
          if-no-files-found: error
          retention-days: 90
